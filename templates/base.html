<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ZikosCompta{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a class="brand" href="{{ url_for('index') }}">🎷 ZikosCompta</a>
  <a href="{{ url_for('doc_list', kind='facture') }}">Factures</a>
  <a href="{{ url_for('doc_list', kind='devis') }}">Devis</a>
  <a href="{{ url_for('expenses') }}">Frais</a>
  <a href="{{ url_for('clients') }}">Clients</a>
  <a href="{{ url_for('report') }}">Bilan</a>
  <a href="{{ url_for('settings_page') }}">Réglages</a>
</nav>
<main>
  {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
